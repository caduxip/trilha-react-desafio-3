# Orquestra o frontend estático e a API mock local.
# O objetivo aqui é deixar a subida previsível para desenvolvimento e demonstração.
services:
  api:
    image: ${TRILHA_API_IMAGE:-trilha-react-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trilha-react-api
    restart: unless-stopped
    ports:
      - '${TRILHA_API_PORT:-8001}:8001'
    volumes:
      - ./db.json:/app/db.json
    # A API é considerada saudável quando o recurso básico de usuários responde.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8001/users']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ${TRILHA_FRONTEND_IMAGE:-trilha-react-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Como o app roda no navegador do host, o endereço padrão da API
        # precisa ser acessível fora do container.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://127.0.0.1:8001}
    container_name: trilha-react-frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '${TRILHA_FRONTEND_PORT:-3000}:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
