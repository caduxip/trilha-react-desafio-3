services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trilha-react-api
    ports:
      - '8001:8001'
    volumes:
      - ./db.json:/app/db.json

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8001}
    container_name: trilha-react-frontend
    depends_on:
      - api
    ports:
      - '3000:80'
