name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # O verify:ci consolida formatacao, lint, testes com cobertura e build.
      # Se a cobertura global cair abaixo do piso configurado no Jest,
      # esta etapa falha e bloqueia a pipeline.
      - name: Executar verificacoes do frontend
        run: npm run verify:ci

      - name: Publicar artefato de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Publicar artefato de build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CI: true

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar smoke E2E
        run: npm run e2e

      - name: Publicar relatorio do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
